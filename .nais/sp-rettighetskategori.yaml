apiVersion: nais.io/v1alpha1
kind: Application
metadata:
  name: sp-rettighetskategori
  namespace: tbd
  labels:
    team: tbd
spec:
  port: 8080
  startup:
    path: isready
    initialDelay: 20
    periodSeconds: 5
    failureThreshold: 9
  liveness:
    path: isalive
  readiness:
    path: isready
  preStopHook:
    http:
      path: /stop
  observability:
    autoInstrumentation:
      enabled: true
      runtime: java
    logging:
      destinations:
        - id: elastic
        - id: loki
  resources:
    requests:
      cpu: 50m
      memory: 512Mi
    limits:
      memory: 512Mi
  replicas:
    min: 1
    max: 1
  prometheus:
    enabled: true
    path: /metrics
  env:
    - name: KAFKA_CONSUMER_GROUP_ID
      value: tbd-sp-rettighetskategori-v1
    - name: KAFKA_RAPID_TOPIC
      value: tbd.rapid.v1
  accessPolicy:
    outbound:
      rules:
        - application: logging
          namespace: nais-system
