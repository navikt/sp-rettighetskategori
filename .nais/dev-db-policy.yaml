apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sp-rettighetskategori-db-policy
  namespace: tbd
spec:
  egress:
    - to:
        - ipBlock:
            # Public IP-en til Cloud SQL-instansen sp-rettighetskategori.
            # Slås opp med: kubectl get sqlinstance sp-rettighetskategori -n tbd -o jsonpath='{.status.publicIpAddress}'
            cidr: 35.228.247.235/32
  podSelector:
    matchLabels:
      dbPolicyUser: sp-rettighetskategori-opprydding-dev
  policyTypes:
    - Egress
